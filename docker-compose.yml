services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axiomledger
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axiom}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiomledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-axiom}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-axiom}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  wallet-service:
    build:
      context: .
      dockerfile: src/WalletService/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=axiomledger;Username=axiom;Password=${POSTGRES_PASSWORD:-axiom}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-axiom}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-axiom}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  transaction-history-service:
    build:
      context: .
      dockerfile: src/TransactionHistoryService/Dockerfile
    environment:
      ConnectionStrings__Redis: redis:6379
      WalletService__BaseUrl: http://wallet-service:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-axiom}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-axiom}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wallet-service:
        condition: service_started
    ports:
      - "127.0.0.1:5102:8080"

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-axiom}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-axiom}
    depends_on:
      rabbitmq:
        condition: service_healthy

  yarp-gateway:
    build:
      context: .
      dockerfile: src/YarpGateway/Dockerfile
    depends_on:
      wallet-service:
        condition: service_started
      transaction-history-service:
        condition: service_started
    ports:
      - "127.0.0.1:5100:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      yarp-gateway:
        condition: service_started
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
